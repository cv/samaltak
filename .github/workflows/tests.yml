name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.targets }}
    # make test's stages (see the Makefile), so that each job fits its timeout and every stage reports
    strategy:
      fail-fast: false
      matrix:
        targets:
          - test-core
          - test-jit-none
          - test-jit-baseline
          - test-jit-opt test-jit-cache
          - test-jit-deopt test-tools
          - test-uefi
          - test-ffi-headless test-ffi-gpu-paged
          - test-ffi-no-platform
          - test-ffi-display
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      SDL_VIDEODRIVER: x11
      SDL_VIDEO_X11_SCALING_FACTOR: '2'
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      XDG_RUNTIME_DIR: /tmp/samaltak-runtime
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential nodejs python3 perl less openssl \
            xvfb xauth mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
      - uses: actions/checkout@v6
      - name: Install SDL3 and shaderc
        run: .agents/setup
      - name: Run hosted FFI checks without a display
        if: ${{ matrix.targets == 'test-ffi-headless test-ffi-gpu-paged' || matrix.targets == 'test-ffi-no-platform' }}
        run: make ${{ matrix.targets }}
      - name: Run ${{ matrix.targets }} with software Vulkan
        if: ${{ matrix.targets != 'test-ffi-headless test-ffi-gpu-paged' && matrix.targets != 'test-ffi-no-platform' }}
        env:
          SAMALTAK_TEST_TRACE: ${{ matrix.targets == 'test-jit-deopt test-tools' && '1' || '' }}
        run: |
          mkdir -p .context "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x1024x24' make ${{ matrix.targets }}
      - name: Upload headless FFI failure logs
        if: ${{ failure() && (matrix.targets == 'test-ffi-headless test-ffi-gpu-paged' || matrix.targets == 'test-ffi-no-platform') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.targets == 'test-ffi-no-platform' && 'ffi-no-platform' || 'ffi-headless' }}
          path: |
            build/ffi-headless-logs/
            build/ffi-no-platform-logs/
            build/ffi-bigint-owned-logs/
          if-no-files-found: ignore
      - name: Upload display FFI proofs
        if: ${{ always() && matrix.targets == 'test-ffi-display' }}
        uses: actions/upload-artifact@v4
        with:
          name: ffi-display
          path: build/ffi-display-logs/
          if-no-files-found: ignore
