name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      SDL_VIDEODRIVER: x11
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      XDG_RUNTIME_DIR: /tmp/samaltak-runtime
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential nodejs python3 perl \
            xvfb xauth mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
      - uses: actions/checkout@v4
      - name: Install SDL3 and shaderc
        run: .agents/setup
      - name: Run all tests with software Vulkan
        run: |
          mkdir -p .context "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x1024x24' make test
